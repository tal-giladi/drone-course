# Multiple-choice version of the quiz in 05.03-compass-and-baro.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 7451c1cf628d
  question: Israel's magnetic field is 44.5 uT, inclined 47 deg below horizontal. Why is only about 30.3 uT useful for heading?
  options:
    - Only the horizontal component (44.5 cos 47) gives a heading
    - The vertical component (44.5 sin 47) is the part used for heading
    - Local declination cancels about a third of the total field
    - The sensor saturates above 30 uT, so the rest is clipped
  correct: 0
- source: 24eefbc2aa3a
  question: You calibrate the compass by only tipping the aircraft about +/-30 deg. Why is the resulting z offset confidently wrong?
  options:
    - The magnetometer's z axis is simply less sensitive than its x and y axes
    - Poor sphere coverage leaves the fit nearly singular in z, yet it still answers
    - Tilting less than 30 deg makes the hard-iron offset rotate with the Earth field
    - The solver silently rejects z samples as outliers when the tilt is small
  correct: 1
- source: 08c1432395d4
  question: An uncalibrated hard-iron offset gives up to 31.8 deg of heading error. Why can't you just subtract a constant heading correction?
  options:
    - The offset grows with motor throttle, so it is never actually a constant
    - The hard-iron offset decays steadily over the course of each flight
    - The offset is fixed in the body frame, so the error varies with heading
    - The error depends only on latitude and inclination, not on the aircraft
  correct: 2
- source: e701ac396347
  question: With a 110 mm compass mast, an untwisted pack lead gives about 31.4 deg hover error. Twisting the pair 4 mm apart gives roughly what, and why?
  options:
    - About 15.7 deg, since twisting the pair simply halves the net current flowing
    - About 31.4 deg, since twisting does not change the net current in the pair
    - About 0.03 deg, since a twisted pair's field falls off as 1/r^3 with distance
    - About 1.3 deg, since the dipole field falls as 1/r^2, a factor of about 28
  correct: 3
- source: e94c93bd61f9
  question: A barometer resolves 12 cm but reads about 5 m off at 10 m/s cruise. At 12.02 Pa/m, what causes it?
  options:
    - Dynamic pressure 0.5 rho V^2 = 61.2 Pa at the static port
    - A weather-driven pressure change over the course of the flight
    - Temperature scale error from flying in unusually hot air
    - Self-heating of the sensor from the flight controller's regulator
  correct: 0
- source: 39e16bac9981
  question: Hovering for 22 minutes, baro altitude drifts 3 m. A 1 hPa/h synoptic change and 12.02 Pa/m sensitivity apply. Is the sensor faulty?
  options:
    - Yes, a healthy barometer should drift less than 0.5 m in a whole flight
    - No, 1 hPa/h is about 8.3 m/h, so about 3 m in 22 minutes
    - Yes, 1 hPa/h would only produce about 0.3 m of drift in 22 minutes
    - No, but it is just sensor noise that longer averaging would remove
  correct: 1
- source: 881c4f25aee0
  question: On a 42 deg C day, what does a barometer using the standard 15 deg C atmosphere read at a true height of 100 m?
  options:
    - About 108.6 m, because hot air is denser than the standard model
    - About 100 m, because temperature cancels out of the barometric formula entirely
    - About 91.4 m, because pressure falls more slowly with height in hot air
    - About 85.0 m, because hot air is much less dense and the error doubles
  correct: 2

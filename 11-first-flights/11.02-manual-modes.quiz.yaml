  question: The same roll stick is used in ACRO, STABILIZE and LOITER. What does it command in each mode?
  options:
    - "ACRO: a roll angle; STABILIZE: a roll rate; LOITER: a velocity"
    - "ACRO: a roll rate; STABILIZE: a velocity; LOITER: a roll angle"
    - "All three: a roll angle, with a different maximum per mode"
    - "ACRO: a roll rate; STABILIZE: a roll angle; LOITER: a velocity"

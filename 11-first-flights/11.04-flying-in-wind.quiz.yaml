- source: 01a4fcd4e737
  question: How do you measure the wind at flying height without a wind meter?
  options:
    - Read the peak lean angle in LOITER over about 30 s and apply a = g*tan(theta)
    - Read the mean lean angle in LOITER over about 30 s and apply a = g*tan(theta)
    - Read the ground speed in LOITER, since it equals the wind speed at that height
    - Measure the wind at your face and scale it up with the one-seventh power law
  correct: 1
- source: 63360f6992bc
  question: An 18 m/s wind uses only 52% of ANGLE_MAX. What actually limits how much wind you can fly in?
  options:
    - The attitude limit, which gusts will reach well before the mean
    - Motor temperature from holding high throttle against the wind
    - The energy needed to fly the return leg home into the wind
    - GNSS position accuracy, which degrades in strong gusty wind
  correct: 2
- source: 04ed8fec3922
  question: Why does hover endurance improve between calm air and an 8 m/s wind?
  options:
    - The wind cools the motors and ESCs, which raises their efficiency and cuts the losses
    - The aircraft leans into the wind, which tilts less of the thrust away from vertical
    - Holding in wind is like forward flight in still air, which costs less than hovering
    - The wind blowing over the frame gives it extra lift, as if it were flying like a kite
  correct: 2
- source: a873d4954d2e

  question: Which nose-in heading is hardest to fly, and why is it not 180 deg?
  options:
    - "180 deg: every input is inverted, and inversion is the hardest mapping to reason about"
    - "90 or 270 deg: yaw authority is weakest sideways, so small corrections are sluggish"
    - "45 deg: the stick mixes two axes, which is harder than any pure rotation"
    - "90 or 270 deg: the controls are rotated, so corrections go perpendicular to the error"
  correct: 3

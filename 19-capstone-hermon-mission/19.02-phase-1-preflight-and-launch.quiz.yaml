# question + answer; if the lesson changes, the site flags the question for review.
- source: 4cc3ef232b4d
  question: The naive sum of all preflight tasks is 32:45. Why does the fifteen-minute target look impossible, and why is it not?
  options:
    - Practice makes every task faster until the total reaches fifteen minutes
    - The target covers only aircraft work, which comes to about 15:12
    - The waits vanish once the batteries are pre-heated in the car
    - The 32:45 sum double-counts every item on the preflight card
  correct: 1
- source: 711d722cf962
  question: What does 'power the aircraft first' buy, and what does it cost?
  options:
    - Warm batteries, at no cost under any condition whatsoever
    - Faster arming, at the cost of slightly higher battery draw on the pad
    - 393 s of GNSS, EKF and boot convergence, if the safety pin is in
    - Early Remote ID, at the cost of a failed LAANC request
  correct: 2

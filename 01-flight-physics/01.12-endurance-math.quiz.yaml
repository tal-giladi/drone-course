- source: 4f0fec970ef8
  question: Why is a quad an endurance aircraft rather than a range aircraft?
  options:
    - Its cruise is slow, so its value is time on station; the mission is a time requirement
    - Its batteries are too heavy for range, so it must stay within sight of the pilot
    - Its props are only efficient in hover, so any forward flight uses more power than hover
    - Regulations cap its range at 2 km, so endurance is the only metric that can grow
  correct: 0
- source: 09662a95f006
  question: Measured energy is 20% above the model. How do you separate an FM error from a CdA error?
  options:
    - "Compare battery temperature: a hot pack points to an FM error, a cool pack points to a CdA error"
    - "Compare the climb segment: a slow climb points to CdA, a fast climb points to FM"
    - "Compare the hover segment: high hover points to FM or fixed losses; high cruise only points to CdA"
    - "Compare the link RSSI: a weak link points to FM, a strong link points to CdA"
  correct: 2

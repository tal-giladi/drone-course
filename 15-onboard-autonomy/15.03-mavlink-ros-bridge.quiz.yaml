  question: You subscribe at 50 Hz and receive 10. Where is the rate set, and how do you fix it?
  options:
    - By the FC's stream rates; raise SRn_ on the companion's port only, leaving the radio's set
    - By the subscriber's QoS depth; raise the depth to 50 so more messages are buffered for the node
    - By the radio's air rate; raise it globally so every port streams at the higher rate
    - By MAVROS's own publish timer; set its rate parameter to 50 Hz in the launch file

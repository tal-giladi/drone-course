  question: In a field with no laptop, how should you know the stack is ready?
  options:
    - An SSH session from a phone, checking the systemd unit status of each individual companion service
    - Waiting a fixed 78 seconds after power-up and then arming without further checks
    - STATUSTEXT on the ground station, displayed heartbeat fields, and an LED or buzzer pattern
    - Arming and watching whether the aircraft takes off by itself when switched to GUIDED

  question: What does step 3 of the flight ladder (companion running and publishing, but commanding nothing) answer?
  options:
    - Whether the companion alone can arm, take off and hold a hover completely by itself
    - Whether merely running the stack changes how the aircraft flies; it should not
    - Whether setpoints reach the flight controller at the rate the loop needs

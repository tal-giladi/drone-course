  question: How long does copying a 12.6 MB bag over the 250 B/s telemetry link take?
  options:
    - About 14 minutes
    - About 1.4 hours
    - About 50 seconds
    - About 14 hours
  correct: 3
- source: 7867463fb910
  question: What does the "fill the disk" bench test check?
  options:
    - That a full disk stops only the logging, while the stack keeps flying and the watchdog reports it
    - That the logger rotates old bags fast enough that the disk can never fill up during a long survey flight
    - That the SD card's sustained write speed keeps up with raw image bagging at the trigger rate
    - That a full disk triggers an immediate RTL so that no flight continues without its logging
  correct: 0

# Multiple-choice version of the quiz in 13.02-error-sources.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: c54fa0f88c83
  question: The ionosphere is 4 m of a 4.50 m UERE. Why does removing it cut the UERE to about 2.05 m rather than to 0.50 m?
  options:
    - The other error sources grow once the ionosphere is removed, filling part of the gap
    - Removing the ionosphere adds a new modelling error of about 1.5 m to the budget
    - Independent errors add in quadrature, so the root of the remaining variance is left
    - UERE is multiplied by DOP, so the saving is scaled back up by the sky geometry
  correct: 2
- source: 2594afaffadc
  question: In position error = DOP x UERE, what depends on your receiver?
  options:
    - The DOP, which a receiver with more channels can improve very substantially
    - All of UERE, including the ionosphere and troposphere contributions
    - Both terms equally, since a better receiver tracks more satellites
    - Only the multipath and receiver-noise parts of UERE, the smallest terms
  correct: 3
- source: 1178b6f0c8d1
  question: Why is VDOP always worse than HDOP, and can a better receiver fix it?
  options:
    - Vertical signals pass through more atmosphere; a dual-frequency receiver fixes that
    - All satellites are overhead, so vertical geometry is one-sided; no receiver can fix that
    - Receiver antennas have low gain overhead; a better antenna pattern fixes that
    - The ellipsoid is flattened at the poles; a receiver with a better geoid model fixes that
  correct: 1
- source: d2118a7537d2

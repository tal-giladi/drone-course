  question: Why does averaging ten minutes of stationary data not remove multipath?
  options:
    - Multipath changes too quickly for ten minutes of averaging to capture its pattern
    - A reflection is always a longer path, so multipath is a one-sided bias, not noise
    - Averaging removes multipath only if the receiver is moving between the samples

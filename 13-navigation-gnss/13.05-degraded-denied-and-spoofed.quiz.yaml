  question: The GPS signal arrives near -128.5 dBm while thermal noise in its 2.046 MHz bandwidth is -110.9 dBm. Why does that matter for jamming?
  options:
    - Correlation gain of 43.1 dB, plus the antenna gain, leaves about 60 dB of jamming margin
    - Correlation gain of 43.1 dB, less about 6 dB for loops, leaves only 37.1 dB of margin
    - The signal is already below the noise floor, so any jammer at all denies it immediately
    - The 17.6 dB deficit below the noise floor is the entire margin against interference
  correct: 1

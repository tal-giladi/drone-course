  question: In the least-squares code, what is the fourth column of the design matrix, and why is it the same in every row?
  options:
    - The satellite elevation, which is the same because all satellites share one orbit shell
    - The line-of-sight z component, which is the same because the receiver is at one altitude
    - 1.0, the derivative with respect to c*dt; the clock error is shared by all satellites
    - The pseudorange residual, which is the same because the solver averages it over all rows
  correct: 2

- source: 057838028b3d
  question: A 30 m error on a satellite at 9 deg elevation moved a six-satellite fix by 18 m. Why is this the shape of a multipath failure?
  options:
    - Low satellites have the weakest clocks, and clock errors mostly corrupt the horizontal solution
    - Reflections are commonest at high elevation, and high satellites mostly steer the vertical solution
    - Reflections are commonest at low elevation, and low satellites mostly steer the horizontal solution
    - Low satellites pass through more ionosphere, and ionospheric delay is always about 30 m
  correct: 2

- source: 29bf3fd9494f
  question: The navigation message runs at 50 bits/s. Why can a cold start take 12.5 minutes when a warm start takes 18 seconds?
  options:
    - A warm start needs one 1,500-bit frame; a cold start must download ephemeris for all 118 satellites
    - Warm needs one 900-bit ephemeris; cold may need the 25-frame almanac of 1,500 bits each
    - A cold start must wait for the receiver crystal to warm up and stabilise before it can correlate
    - A warm start uses the phone network for assistance; a cold start relies on the satellites alone

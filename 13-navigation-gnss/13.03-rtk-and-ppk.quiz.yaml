  question: What does double differencing remove, and what does it deliberately leave behind?
  options:
    - Satellite and receiver clocks, orbit error and multipath; it leaves geometry and the full atmospheric delay as well
    - The integer ambiguity and the receiver clocks; it leaves geometry, orbit error and most of the atmosphere
    - Satellite and receiver clocks, orbit error, most atmosphere; leaves geometry, noise and the integer ambiguity
    - Only the receiver clocks; it leaves the satellite clocks, orbit error, atmosphere and integer ambiguity
  correct: 2
- source: ce2954cd4ac9
  question: At a 35 km baseline RTK accuracy is still about 36 mm. Why is 35 km nevertheless the practical limit?
  options:
    - The correction link cannot carry data more than 35 km, so the rover loses the base entirely
    - Beyond 35 km the base and rover see different satellites, so double differences are impossible
    - Accuracy degrades linearly past 35 km and reaches a metre within a few more kilometres
    - Residual atmosphere nears half a wavelength, so integers stop fixing; float is decimetres
  correct: 3
- source: 64a52e3fadf5
  question: Twelve satellites with a +/-5 cycle bracket give about 2.9 x 10^11 integer candidates. How does real RTK avoid testing them all?
  options:
    - It tests them all on a GPU, which takes only a few seconds on modern hardware
    - LAMBDA decorrelates the ambiguities, and a better float narrows the bracket
    - It fixes one satellite at a time and assumes the rest share the same integer
    - It rounds the float solution to the nearest integers and skips the search
  correct: 1

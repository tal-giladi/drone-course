    - The L1 minus L2 combination, about 86.19 cm, fixed first to constrain L1
    - The L1 minus L2 combination, about 86.19 cm, used to remove the ionospheric delay
    - The L1 carrier alone, about 19.03 cm, fixed first to constrain the L2 integers

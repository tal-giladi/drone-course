  question: The carrier phase is about 263x more precise than the code. Why has it not simply replaced the code?
  options:
    - "It is ambiguous: a fraction of a 19 cm cycle, but not which cycle"
    - It is too weak to track except with a large survey-grade antenna
    - It is only broadcast on L2, which consumer receivers cannot decode
    - It drifts with the satellite clock, which only the code can remove

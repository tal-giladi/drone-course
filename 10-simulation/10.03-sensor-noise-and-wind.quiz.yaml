  question: Which sensor would you upgrade first for position hold, and what does RTK buy you?
  options:
    - "The IMU: its drift dominates; a better one lets you hold position without any GNSS"
    - "The GNSS: its 1 m noise dominates; RTK gives centimetre, not metre, position sigma"

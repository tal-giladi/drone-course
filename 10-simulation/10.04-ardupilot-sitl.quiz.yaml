- source: 191b0665d898
  question: A SITL log shows PM.NLon in the hundreds. What are two possible causes, and how do you tell them apart?
  options:
    - A bad EKF lane or a missing GPS signal; re-run with EKF3 disabled to compare the logs
    - Vibration or clipping; re-run with SIM_VIB_FREQ set to zero to compare
    - Real firmware overload, or --speedup too high for the machine; re-run at --speedup 1
    - A wrong frame class or bad gains; re-run with default parameters loaded
  correct: 2
- source: e1a6011126db
  question: Why is a sleep() in a scripted SITL flight a bug rather than a style problem?
  options:
    - "SITL runs faster than real time: sleep(15) at 10x lets 150 simulated seconds pass"
    - sleep() pauses the SITL process itself, freezing the simulated aircraft in mid-air
    - SITL runs slower than real time, so sleep(15) ends before the aircraft has moved
    - sleep() is non-deterministic in Python, so no two runs can ever be repeated
  correct: 0

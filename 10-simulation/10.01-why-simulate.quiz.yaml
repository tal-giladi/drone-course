- source: 8865f23fba22
  question: Why is a simulator that agrees with your controller not evidence that the controller is right?
  options:
    - Simulators always agree with controllers, because both of them run on the same CPU clock
    - You wrote both, so they share assumptions like a = g tan(theta); agreeing is consistency
    - The simulator lacks noise, so it can never disagree with a controller that is stable
    - Agreement only proves the controller is right at the simulator's fixed time step
  correct: 1

  question: Which rung of the simulation ladder is the important jump, and why?
  options:
    - From pencil calculations to your own simulator, which is the first to add nonlinear dynamics
    - From SITL to Gazebo, which first adds realistic airframe physics to the simulation
    - From Gazebo to hardware-in-the-loop, which first runs on the real flight controller

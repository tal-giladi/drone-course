  question: Simulation catches 40 % of this course's failure modes. What do those have in common?
  options:
    - They are logic bugs, like mixer sign errors or failsafe races, which simulators reproduce
    - They are physical faults, such as vibration and magnetics, which simulators model well
    - They occur only at high speed, which is where the simulated aerodynamics are most accurate
    - They are all tuning problems, which SITL solves automatically by sweeping the gains

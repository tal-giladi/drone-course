  question: What is the deliverable of the why-simulate lesson, and why does it make flight testing cheaper?
  options:
    - A validated simulator, which removes the need for most flight testing altogether
    - A crash-cost table, which justifies buying spare parts before any flight testing
    - A SITL install, which lets every flight test be rehearsed first at ten times real time

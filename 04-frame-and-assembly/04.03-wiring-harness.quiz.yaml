# Multiple-choice version of the quiz in 04.03-wiring-harness.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: b4995163719d
  question: How much more copper area is in 12 AWG than 18 AWG?
  options:
    - Six times, since each AWG step adds one unit of area
    - Four times, since every three AWG steps double the area
    - Twice, since every six AWG steps double the area
    - Ten times, since every six AWG steps multiply area by ten
  correct: 1
- source: f1f3f0eb2aed
  question: Hermon's 12 AWG trunk is rated 41 A but pulls 57 A at full throttle. Why is that acceptable?
  options:
    - Silicone wire ratings are conservative by a factor of two in all conditions
    - The pack sags at full throttle, so the real current never exceeds 41 A
    - Ampacity is steady-state; a short burst only warms the wire a few degrees
    - Airflow from the props doubles the rating of any wire on a multirotor
  correct: 2
- source: a4b9d2dee0c7
  question: Harness loss at hover is only 0.28 W. Why does gauge still matter?
  options:
    - Wires fail by cold joints, chafing and burst heat, not by inefficiency
    - Loss grows with flight time, so after 20 minutes it becomes significant
    - Thin wire raises the pack's internal resistance and shortens its life
    - Regulations require each wire to lose under 0.1 W at full throttle
  correct: 0
- source: c4b266851eb5
  question: Why is the 300 mm, 5 V, 3 A servo rail drop-limited when the pack trunk is heat-limited?
  options:
    - The servo rail carries more current than the trunk, so it overheats first
    - Drop grows with length, ampacity does not; long thin runs bind on drop
    - Voltage drop matters only at high voltage, so the trunk is drop-limited
    - Heat is only a concern for short wires, so the thick trunk binds on heat
  correct: 1
- source: f199b351057e
  question: Why can a 25 W iron not solder a 12 AWG joint in reasonable time?
  options:
    - A 25 W iron cannot even reach solder melting temperature at its own tip
    - The iron draws its full 25 W only when the tip is idle in the stand
    - Thick copper reflects heat, so the iron's power bounces off the joint
    - Of ~15 W at the tip, ~12 W conducts away, leaving ~3 W for the joint
  correct: 3
- source: 042cf36a4d02
  question: How far from the compass must a single wire carrying 10.2 A be to contribute only 4.45 uT (B = mu0 I / 2 pi r)?
  options:
    - About 458 mm, so you twist the pair, use a mast and run COMPASS_MOT
    - About 46 mm, so keeping wires a few cm from the compass is enough
    - About 4.6 m, so the compass must be disabled on any drone this size
    - About 458 mm, so you route the wire around the compass in a loop
  correct: 0
- source: edbb113b0370
  question: Israeli packs usually come with EC5, not XT60. What should you do?
  options:
    - Keep XT60 on the aircraft and fit an adapter to every pack
    - Cut off EC5 and solder XT60 onto every pack you buy
    - Fit EC5 to the aircraft, with at most one labelled adapter
    - Keep a set of adapters so any pack can connect either way
  correct: 2

- source: 8ede4a9bad77
  question: What happens when a DShot frame fails its 4-bit CRC?
  options:
    - The ESC stops the motor until a valid frame arrives
    - The ESC uses it anyway as a new throttle value
    - The ESC requests a retransmit from the controller
    - The ESC discards it and holds the previous value
  correct: 3
- source: dcdbd6e3e2d6
  question: Why does DShot need no throttle calibration when PWM does?
  options:
    - DShot sends an integer, which means the same on every board
    - DShot runs at a fixed 600 kHz, which every ESC learns at boot
    - DShot includes the min and max values in every telemetry reply
    - DShot is analogue, so the ESC reads the voltage directly
  correct: 0

- source: feae52990085
  question: Most of Hermon's 470 microsecond command latency comes from where, and what does that imply?
  options:
    - The DShot600 frame itself (59%), so a faster protocol roughly halves the latency
    - The gyro filter (59%), so removing filters is the main fix
    - The ESC CRC check (59%), so disabling it is the best upgrade
    - The motor L/R time constant (59%), so protocol upgrades buy little
  correct: 3
- source: f0cbe1810f89
  question: Why is bidirectional DShot the most important feature in this lesson?
  options:
    - It doubles the throttle resolution to 12 bits, allowing much finer hover control
    - It lets the ESC command the flight controller during a failsafe
    - Per-motor rpm feeds the dynamic notch filter, allowing a useful D term
    - It removes the need for a CRC, which cuts the frame length in half
  correct: 2

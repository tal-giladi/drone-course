  question: An ESC on a 14-pole (7 pole pair) motor reports 32,900 eRPM with 3-blade props. What is the blade-pass noise fundamental?
  options:
    - About 548 Hz
    - About 78 Hz
    - About 235 Hz
    - About 1,645 Hz

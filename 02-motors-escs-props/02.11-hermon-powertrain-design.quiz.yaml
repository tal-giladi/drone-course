  question: Hermon's endurance claim is 22 minutes. What makes that claim meaningful rather than marketing?
  options:
    - "It lists explicit conditions: mass, prop FM, usable energy, wind, heat"
    - It was measured once in calm air on a fully charged brand-new pack
    - It is quoted at 100 % depth of discharge, the pack's full rated capacity
    - It is calculated from the pack C-rating and the motor manufacturer's data

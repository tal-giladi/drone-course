  question: Of the five constraints (prop clearance, hover throttle, thrust margin, current, thermal), which two does Hermon pass only narrowly?
  options:
    - Prop clearance and hover throttle (48 % vs the 40-60 % band)
    - Current (14.1 A vs 15 A) and thermal (83 C on a 38 C day)

- source: 93086e7397ab
  question: Why is a substitute spec (stator class, KV range, current, mounting, mass) more useful than a part number?
  options:
    - It guarantees the substitute will match the original part's efficiency exactly
    - It is required by the regulator before a motor may be flown on a registered drone
    - It lets you order parts from any vendor without checking their datasheets
    - It lets you judge any alternative quickly when the reference part is out of stock
  correct: 3

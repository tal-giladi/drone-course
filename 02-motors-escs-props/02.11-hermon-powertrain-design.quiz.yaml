- source: a5286dd35fc5
  question: A 1700 KV motor gives Hermon a 13:1 thrust-to-weight ratio. Why is that not an argument for it?
  options:
    - High thrust-to-weight always reduces endurance, so no design should exceed 3:1
    - Higher KV motors cannot run on 6S packs at all, so it would not even spin up
    - It fails hover throttle, current and thermal; thrust margin is one of five
    - A 13:1 ratio breaks regulatory limits on the maximum climb rate of drones

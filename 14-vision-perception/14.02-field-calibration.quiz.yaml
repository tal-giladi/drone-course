- source: b9a56a36ad3e
  question: How far out of place is the corner of an uncalibrated frame, and why does casual inspection miss it?
  options:
    - About 36 px (0.75 m at 60 m); radial distortion is uniform, so it looks like a simple shift
    - About 362 px (7.46 m at 60 m); distortion grows as radius cubed, so it hides at the edges
    - About 362 px (7.46 m at 60 m); radial distortion is largest at the centre, where it looks natural
    - About 7 px (0.15 m at 60 m); radial distortion is tiny, so no inspection could detect it
  correct: 1
- source: 9bef2740d56f
  question: Why is assuming cx, cy = w/2, h/2 a bias rather than noise?
  options:
    - The principal point wanders with temperature, so every frame has a different random error
    - The principal point is exactly at the centre, so the assumption adds no error of any kind
    - The lens is fixed off-centre at manufacture, so every frame has the same directional error
    - The sensor readout shifts the centre each frame, so averaging many frames removes the error
  correct: 2
- source: 71b7a43aa1c8
  question: Why can a calibration shot only head-on to the board not determine the focal length?
  options:
    - Image scale is f*Z, so moving the board further away always reveals the focal length
    - Head-on shots hide the distortion, so the focal length absorbs all the lens error
    - Head-on shots cannot see the corners, so the fit has too few points to converge
    - Image scale is f/Z, so 1459 px at 0.5 m and 2918 px at 1 m give identical images
  correct: 3
- source: 0cdf148ab06f
  question: What does tilting the calibration board actually add?
  options:
    - Perspective, which breaks the f/Z tie between focal length and distance
    - More corner detections per image, which lowers the noise in the final fit
    - Better lighting on the board, which sharpens the corners for detection
    - A known board angle, which the fit uses as a fixed reference value
  correct: 0

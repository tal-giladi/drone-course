# Multiple-choice version of the quiz in 14.01-cameras-for-uavs.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 841f2358b775
  question: Which single camera number determines the GSD, and how do you get it?
  options:
    - "Megapixels: the total pixel count given on the camera box"
    - "Pixel pitch: imaging width divided by the real pixel count"
    - The sensor's inch format, which sets the physical sensor size
    - The diagonal field of view, divided by the image diagonal
  correct: 1
- source: d89e32418f3b
  question: Why is the diagonal field of view the wrong number to plan a survey with?
  options:
    - The diagonal is measured with distortion removed, so it is smaller than the real view
    - Line spacing comes from the vertical footprint, which the diagonal does not include
    - Line spacing uses the horizontal footprint, and the diagonal is the largest angle
    - The diagonal changes with focus, so it is only valid for the calibration distance
  correct: 2
- source: 0b17a50a2d21
  question: Your aircraft yaws at 45 deg/s during a 30 ms rolling-shutter readout. How much shear does that put at the frame edge, 2,000 px from centre?
  options:
    - About 7 px
    - About 1.35 px
    - About 470 px
    - About 47 px
  correct: 3
- source: cf96b50f62d9
  question: What causes jello in rolling-shutter footage, and why does a faster shutter not fix it?
  options:
    - An 84.3 Hz vibration spans ~2.5 cycles of the readout; a readout effect, fixed by damping
    - The exposure is too long for the vibration, so each row blurs; a faster shutter fixes it fully
    - An 84.3 Hz vibration beats with the frame rate; it is an exposure effect, fixed by a faster shutter
    - Electrical noise from the ESCs corrupts the readout; it is fixed by shielding the camera cable
  correct: 0
- source: "759920216112"
  question: By the one-pixel blur rule, what is the longest exposure at 60 m altitude (GSD 2.06 cm) and 5 m/s ground speed?
  options:
    - About 41 ms (1/24 s)
    - About 4.1 ms (1/244 s)
    - About 0.41 ms (1/2440 s)
    - About 12 ms (1/81 s)

- source: f8604b697580
  question: Why is motion blur a light problem rather than a speed problem?
  options:
    - Faster flight always reduces blur because the camera shake averages out over the frame
    - Speed has no effect on blur; only the ISO setting determines how sharp the image is
    - The aircraft's speed sets the aperture, and only the light level sets the ground speed
    - Speed and GSD fix the needed exposure, but the scene's light decides if you get it
  correct: 3
- source: 84ce515700f5
  question: Why does flying lower make motion blur worse, not better?
  options:
    - Lower altitude shrinks the GSD, which halves the allowable exposure time
    - Lower altitude increases vibration from the ground effect under the props
    - Lower altitude puts the ground closer, which demands a much narrower aperture
    - Lower altitude lowers the light level reaching the sensor from the ground
  correct: 0
- source: 355ffc2df381
  question: The global-shutter option gives 1.68x the GSD and a footprint 81% as wide as the rolling-shutter camera. When is it worth it?
  options:
    - Always, because a global shutter removes blur for every scene and every flight profile
    - For static fields flown in straight lines, where its larger GSD speeds up the survey
    - When things move in frame, each image needs one pose, or you fly fast or yaw
    - Never, because the lower resolution always costs more than the distortion it removes
  correct: 2

- source: 1e8f15195f94
  question: Every fault-injection case in the regression suite expects the mission to end in DONE. Why is that right?
  options:
    - Faults are injected after DONE, so the mission always finishes normally
    - The mission may fail, but DONE means it landed under control
    - DONE is the only state the simulator can report after a fault occurs
    - A fault that prevents DONE is a simulator bug, not a mission problem

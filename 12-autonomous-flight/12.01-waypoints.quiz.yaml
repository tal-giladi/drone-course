- source: 2ec131753685
  question: Why download a mission from the aircraft right after uploading it?
  options:
    - Downloading resets home to the current position, which the mission needs before arming
    - The flight controller requires a download to compute the checksum it checks at arming
    - Uploads can partially fail and the editor shows a local copy; the download is the proof
    - Downloading clears the previous mission from memory so the two cannot be mixed in flight

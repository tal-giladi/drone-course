- source: dc9751512720
  question: Which mission command family blocks the sequencer, and what follows for the others?
  options:
    - NAV_* and CONDITION_* both block; DO_* advances once its action has completed
    - Only NAV_* blocks; DO_* advances at once, and CONDITION_* delays only DO items
    - Only DO_* blocks until its action completes; NAV_* commands are queued behind it
    - All three families block in order, so each command waits for the previous one
  correct: 1

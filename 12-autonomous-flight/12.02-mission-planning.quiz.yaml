  question: Why fly survey lines parallel to the wind rather than across it?
  options:
    - Headwind legs are cheaper than crosswind legs, so parallel lines save a large share of the energy
    - A crosswind needs a crab angle (about 24 deg), so switch the camera to trigger by time instead
    - Parallel lines keep ground speed equal on every leg, which the time trigger relies on
    - A crosswind needs a crab angle (about 24 deg for 2 m/s at 5 m/s), pointing the camera off track
  correct: 3

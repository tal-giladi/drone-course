- source: 75be0d425faf
  question: How many of the eight branches of the failsafe ladder can SITL inject on demand?
  options:
    - All eight, crash detection included
    - Five; RC, GCS and terrain loss need real hardware
    - Seven; only crash detection cannot be requested
    - Six; neither EKF failsafe nor crash detection can be requested
  correct: 2
- source: 442120745db4
  question: A quadcopter cannot recover from a motor failure. What does the SITL motor-failure test assert?
  options:
    - That the aircraft can still hold its altitude on the three remaining motors for at least 30 seconds
    - That the aircraft returns to launch on three motors and lands within 30 m of the home point
    - Nothing at all; motor failure is excluded because no recovery is possible on a quadcopter
    - "The designed ending: under 30 m of travel, a bounded descent, disarm on impact and the right log"
  correct: 3
- source: 8338e0b16823
  question: One motor stops, leaving a yaw torque imbalance of 0.0733 N m on Izz = 0.02236 kg m^2. What is the yaw rate one second later?
  options:
    - About 188 deg/s
    - About 3.3 deg/s
    - About 94 deg/s
    - About 10,800 deg/s

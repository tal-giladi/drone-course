    teaches: [lipo, cell-chemistry, nominal-voltage, full-voltage, chemistry-labels]
    skip_if: You can explain what "6S 5000 mAh 40C" means, what the voltage numbers mean, and why a LiPo is a fuel tank.
  - id: "03.02"
    slug: pack-configuration
    title: "Pack configuration: 4S vs 6S, cells, wiring"
    difficulty: intermediate
    time: 60
    requires: ["03.01"]
    optional: ["FEL.03"]
    hardware: []
    software: [python]
    teaches: [series-parallel, pack-config, sag, balance-plug, 4s-vs-6s]
    skip_if: You can choose 4S vs 6S for a given motor KV and payload, and compute the resulting voltage sag.
  - id: "03.03"
    slug: c-rating-voltage-sag
    title: C-rating, current and voltage sag
    difficulty: intermediate
    time: 60

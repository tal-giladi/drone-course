# ---------------------------------------------------------------------------
# PROJECTS
# ---------------------------------------------------------------------------
projects:
- id: "P01"
  slug: first-hover
  title: "Project 1 — First hover"
  difficulty: intermediate
  time: 90
  requires: ["11.03"]
  optional: []
  hardware: [stage1]
  software: [ardupilot, qgc]
  teaches: [hover, first-flight, stability, measurement, evidence]
  skip_if: You have hovered Hermon for 30 s with drift ≤ 0.5 m and the evidence (log + video).
- id: "P02"
  slug: tuned-cascade
  title: "Project 2 — A tuned cascade, measured"
  difficulty: advanced
  time: 180
  requires: ["07.07", "11.03"]
  optional: []
  hardware: [stage1]
  software: [ardupilot, python]
  teaches: [rate-tuning, attitude-tuning, step-response, overshoot, altitude-hold, evidence-from-logs]
  skip_if: Hermon's rate-loop step response overshoots ≤ 20 % and it holds altitude within ±0.3 m over five trials, proven from logs.
- id: "P03"
  slug: sitl-harness
  title: "Project 3 — An overnight SITL regression harness"
  difficulty: advanced
  time: 180
  requires: ["10.05"]
  optional: []
  hardware: []
  software: [sitl, python, docker]
  teaches: [ci, test-matrix, headless-sim, regression-detection, reporting]
  skip_if: A single command runs your mission matrix unattended and produces a pass/fail report with the failing logs attached.
- id: "P04"
  slug: datalink-range
  title: "Project 4 — The datalink, measured"
  difficulty: intermediate
  time: 150
  requires: ["09.05"]
  optional: []
  hardware: [stage1]
  software: [qgc, python]
  teaches: [range-test, rssi-vs-distance, latency-measurement, failsafe-distance, link-budget-validation]
  skip_if: You have a measured RSSI-versus-distance curve for both links, the failsafe trigger distance, and the latency figure.
- id: "P05"
  slug: first-mission
  title: "Project 5 — Five clean autonomous missions"
  difficulty: advanced
  time: 180
  requires: ["12.06"]
  optional: []
  hardware: [stage1]
  software: [ardupilot, qgc]
  teaches: [mission-execution, repeatability, geofence-discipline, rtl, mission-logs]
  skip_if: Five waypoint missions flew and returned with the fence never touched and every log archived.
- id: "P06"
  slug: detection-in-the-air
  title: "Project 6 — Target detection from the air"
  difficulty: advanced
  time: 210
  requires: ["14.05"]
  optional: []
  hardware: [stage2]
  software: [python, yolo, ros2]
  teaches: [aerial-detection, precision-recall, geolocation-accuracy, latency-report, dataset-collection]
  skip_if: Your detector finds the target in ≥ 90 % of frames at 30 m with a measured end-to-end latency and a geolocation error budget.
- id: "P07"
  slug: offboard-autonomy
  title: "Project 7 — Offboard autonomy, end to end"
  difficulty: advanced
  time: 210
  requires: ["15.06"]
  optional: []
  hardware: [stage2]
  software: [ros2, ardupilot, docker]
  teaches: [offboard-control, watchdog-proof, autostart, cable-pull-test, graceful-degradation]
  skip_if: Hermon flies a computer-commanded pattern from a service that starts itself, and survives a cable-pull with a safe fallback.
- id: "P08"
  slug: hermons-mission
  title: "Project 8 — Hermon's mission (capstone)"
  difficulty: advanced
  time: 600
  requires: ["19.05"]
  optional: []
  hardware: [stage1, stage2, stage4, stage5]
  software: [python, yolo, ardupilot, ros2, qgc]
  teaches: [capstone, autonomous-mission, survey, detect, deliver, precision-rtl, evidence, portfolio]
  skip_if: You have flown ten clean Hermon capstone missions with the full evidence pack.


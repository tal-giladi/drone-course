# ---------------------------------------------------------------------------
- id: "01"
  dir: 01-flight-physics
  track: main
  title: Flight physics & aerodynamics
  summary: The four forces, tilt-to-translate, drag, propeller pumping, hover efficiency, stability, wind and the energy math — everything the later control and endurance lessons stand on.
  lessons:
  - id: "01.01"
    slug: four-forces-on-a-quad
    title: The four forces on a hovering quad
    difficulty: beginner
    time: 60
    requires: ["00.01"]
    optional: ["FA.01", "FA.02"]
    hardware: []
    software: [python]
    teaches: [thrust, weight, drag, lift, force-balance, hover]
    skip_if: You can write the force balance for a hovering quad and for a 30-degree banked turn with correct numbers.
  - id: "01.02"
    slug: newton-torque-quad
    title: "Newton & torque: why a quad needs four motors"
    difficulty: beginner
    time: 60
    requires: ["01.01"]
    optional: ["FA.02"]
    hardware: []
    software: [python]
    teaches: [torque, angular-momentum, counter-rotation, control-moments]
    skip_if: You can explain, with numbers, why two counter-rotating pairs cancel spin and how a quad generates roll, pitch and yaw.
  - id: "01.03"
    slug: thrust-to-weight
    title: Thrust, weight and the thrust-to-weight ratio
    difficulty: beginner
    time: 45
    requires: ["01.02"]
    optional: []
    hardware: []
    software: [python]
    teaches: [thrust-to-weight, margin, sizing]
    skip_if: You can size a motor count for a given payload and explain why 2:1 hover margin is not the same as 4:1 full-throttle margin.
  - id: "01.04"
    slug: tilt-to-translate
    title: "Tilt to translate: from hover to motion"
    difficulty: intermediate
    time: 60
    requires: ["01.02"]
    optional: ["FA.04"]
    hardware: []
    software: [python]
    teaches: [tilt, horizontal-thrust, velocity-vs-attitude, acceleration]
    skip_if: You can compute the tilt angle and the horizontal acceleration a quad gets at a given throttle and mass.
  - id: "01.05"
    slug: drag
    title: "Drag: where your battery goes"
    difficulty: intermediate
    time: 60
    requires: ["01.04"]
    optional: ["FA.03"]
    hardware: []
    software: [python]
    teaches: [drag, parasitic-drag, induced-drag, power-vs-velocity, best-range-speed]
    skip_if: You can explain why power has a U-shape versus speed and why fast flight burns the battery much harder than loiter.
  - id: "01.06"
    slug: momentum-theory
    title: "Propellers as pumps: momentum theory and induced velocity"
    difficulty: intermediate
    time: 75
    requires: ["01.03"]
    optional: ["FA.03"]
    hardware: []
    software: [python]
    teaches: [momentum-theory, induced-velocity, actuator-disc, prop-wash]
    skip_if: You can derive hover induced velocity from thrust and disk area, and explain why big slow props are efficient.
  - id: "01.07"
    slug: hover-efficiency
    title: Hover efficiency and disk loading
    difficulty: intermediate
    time: 60
    requires: ["01.06"]
    optional: []
    hardware: []
    software: [python]
    teaches: [disk-loading, figure-of-merit, efficiency, endurance]
    skip_if: You can compute disk loading for Hermon and explain how it predicts hover current.
  - id: "01.08"
    slug: stability
    title: "Stability: why a quad wants to fall (and how it doesn't)"
    difficulty: intermediate
    time: 60
    requires: ["01.02", "01.04"]
    optional: ["FA.02"]
    hardware: []
    software: [python]
    teaches: [static-instability, neutral-stability, damping, control-necessity]
    skip_if: You can explain why a quad is statically unstable in roll/pitch but damped in yaw, and what each implies for control.
  - id: "01.09"
    slug: attitude-orientation
    title: "Attitude & orientation: frames, Euler angles, quaternions (light)"
    difficulty: intermediate
    time: 60
    requires: ["01.02"]
    optional: []
    hardware: []
    software: [python]
    teaches: [coordinate-frames, euler-angles, quaternions, gimbal-lock, ned-enu]
    skip_if: You can rotate a body frame with a quaternion and say why Euler angles are dangerous at 90 degrees of pitch.
  - id: "01.10"
    slug: wind
    title: "Wind: the world moves around you"
    difficulty: intermediate
    time: 60
    requires: ["01.04", "01.05"]
    optional: ["FA.04"]
    hardware: []
    software: [python]
    teaches: [wind, airspeed-vs-gs, drift, headwind-tailwind, endurance-in-wind]
    skip_if: You can compute drift, ground speed and the energy penalty of a headwind round trip.
  - id: "01.11"
    slug: ground-effect
    title: Ground effect and ceiling effect
    difficulty: intermediate
    time: 45
    requires: ["01.06"]
    optional: []
    hardware: []
    software: [python]
    teaches: [ground-effect, ceiling-effect, takeoff-thrust, landing-drag]
    skip_if: You can explain why takeoff needs less throttle than hover and why landing over a hard surface is harder than it looks.
  - id: "01.12"
    slug: endurance-math
    title: "Payload, range and endurance: the energy math"
    difficulty: intermediate
    time: 75
    requires: ["01.05", "01.07"]
    optional: ["FA.03", "FEL.03"]
    hardware: []
    software: [python]
    teaches: [endurance, range, energy-budget, battery-chemistry, loiter]
    skip_if: You can build Hermon's energy budget and predict loiter time within 15 percent, and show why payload kills range.


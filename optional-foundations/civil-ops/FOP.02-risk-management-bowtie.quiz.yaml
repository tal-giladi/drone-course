  question: Four hazards all score 6 on a likelihood x severity matrix. What does the single score throw away?
  options:
    - Nothing; equal scores mean the treatments are equivalent
    - Which axis drives it, which is what decides the treatment
    - How many barriers are already in place for each hazard
    - The financial cost of each hazard, which matrices omit

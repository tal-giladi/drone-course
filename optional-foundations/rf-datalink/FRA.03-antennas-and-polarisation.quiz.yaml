# Multiple-choice version of the quiz in FRA.03-antennas-and-polarisation.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: c24a61db9973
  question: What is a dipole's radiation pattern, and where is its null?
  options:
    - "A sphere: equal in all directions, with no null at all"
    - "A donut: peak off the tips, with a sharp null broadside"
    - "A donut: peak broadside, with a sharp null off the tips"
    - "A cone: peak off the tips, with a null behind the feed"
  correct: 2
- source: c5eed09de6ff
  question: Why is a ground plane not optional for a monopole?
  options:
    - It is the missing half; otherwise coax or carbon arms take that role
    - It shields the receiver from motor noise, which otherwise dominates
    - It adds about 3 dB of gain, which every link budget assumes
    - It holds the SWR at exactly 1.0, protecting the transmitter
  correct: 0
- source: a30cfcf46326
  question: With vertical whips on both the aircraft and the ground station, where in a flight is the link weakest?
  options:
    - At the far end of the mission, where path loss is the greatest
    - Directly overhead, where both antennas' nulls point at each other
    - At 45 deg elevation, where the polarisation becomes crossed
    - Low and far away, where the ground reflection cancels it
  correct: 1
- source: fdabe32bbfaf
  question: With linear polarisation, roughly what does 30 deg of aircraft bank cost?
  options:
    - About 25 dB, since the antennas become crossed
    - About 3 dB, since any tilt halves the coupling
    - About 6 dB, since coupling falls linearly with angle
    - About 1.2 dB, since coupling goes as cos^2
  correct: 3
- source: 0101ddab3ac5
  question: When is circular polarisation worth its cost?
  options:
    - "When geometry is uncontrolled: a fixed 3 dB removes a variable 25 dB"
    - Always, since it gains 3 dB over linear at every angle
    - When the two antennas are of opposite sense, to cancel reflections
    - Only on telemetry, since video frames can simply be retried
  correct: 0
- source: 346dbe99bfcd
  question: SWR 3 costs only about 1.25 dB of signal. Why does SWR still matter?
  options:
    - SWR 3 means only a third of the transmitter's power is ever radiated
    - A perfect SWR of 1.0 proves the antenna radiates efficiently
    - Reflected power heats the amplifier; with no antenna, all of it returns
    - Reflected power radiates from the coax and breaks EIRP limits
  correct: 2

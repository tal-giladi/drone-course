- source: 872627af3fa9
  question: A LiPo label shows cell count, capacity, C rating, nominal voltage and connector. What important information does it leave out?
  options:
    - Internal resistance, cell balance and cycle count, which show quality
    - Energy in watt-hours, which cannot be derived from the label
    - Maximum charge voltage, which varies unpredictably by brand
    - Nothing important; the printed fields fully describe the pack's health
  correct: 0
- source: 6c55d706b5f9
  question: Why is pack voltage a poor fuel gauge for a LiPo in mid-flight?
  options:
    - Voltage falls linearly, but the slope differs for every single pack
    - Voltage only changes after landing, once the load is removed
    - "The curve is flat: 70 % to 30 % charge moves a cell only about 0.14 V"
    - The curve is steep mid-range, so readings swing too much to use
  correct: 2
- source: 2770b2f1f033
  question: A 5 Ah pack with 18 milliohm internal resistance is labelled 50C. What happens if you actually draw 250 A?
  options:
    - It runs indefinitely, since 50C is the pack's continuous rating
    - About 1,125 W heats the pack inside; 50C is only a burst figure
    - About 4.5 W heats the pack inside, which is negligible
    - About 4.5 kW heats the pack, so it vents within a second
  correct: 1
- source: 30d62e05b6d2
  question: A 5 Ah pack with 18 milliohm internal resistance can shed about 20 W of internal heat. What is its honest continuous rating, and how does a 10.2 A hover compare?
  options:
    - About 50C (250 A); the hover is only about 2C
    - About 1C (5 A); the hover exceeds it at 2C
    - About 7C (33 A); the hover is about 10C
    - About 7C (33 A); the hover is only about 2C
  correct: 3

  question: How much work does a hovering aircraft do on itself, and where does its battery energy go?
  options:
    - Weight times hover time, stored as potential energy
    - None; almost all of it is lost as heat in the ESCs
    - None; it accelerates air downward, ideally about 76.1 W
    - A little to hold height; most goes into correcting drift

  question: A vector can be written as components or as a magnitude and angle. Which form is more useful for calculation, and why?
  options:
    - Magnitude and angle, because the magnitudes can simply be summed
    - Components, because adding vectors is just adding each axis separately
    - Magnitude and angle, because it carries more information than components
    - Components, because they remove the need to know any direction

  question: Two forces of 10 N and 4 N act on a body in opposite directions. What is the resultant, and how wrong is simply adding the magnitudes?
  options:
    - 14 N; magnitudes always add for forces on one body
    - 6 N; the naive 14 N is about 57 % too large
    - 10.77 N; the naive 14 N is about 30 % too large
    - 6 N; the naive 14 N is about 133 % too large

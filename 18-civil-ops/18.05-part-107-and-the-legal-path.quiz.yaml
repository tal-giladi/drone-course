  question: The Part 107 knowledge test pass mark is 70%. How much of the material should you actually know?
  options:
    - Exactly 70%; matching the pass mark makes a pass on the day near certain
    - About 75%; five points of margin gives about a 99% pass rate
    - About 95%; even 85% passes only about half of the time
    - About 85%; knowing exactly 70% passes only about 56% of the time
  correct: 3
- source: 64c3f65837da
  question: How does a remote pilot certificate stop being valid?
  options:
    - Currency lapses after 24 calendar months without recurrent training
    - The certificate expires after 24 months and the test must be retaken
    - It is revoked if you fly fewer than three flights in any 90 days
    - It never stops being valid; there is no recurrent requirement
  correct: 0

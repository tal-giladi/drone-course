  question: Why does the airspace check belong in the quote rather than on the flight day?
  options:
    - LAANC works only on weekdays, so the booking depends on it
    - Airspace classes change daily, so an early check is pointless
    - "The grid sets lead time: two minutes, or thirty days or more"
    - The client must countersign the authorisation before issue
  correct: 2

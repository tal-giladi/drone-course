# Multiple-choice version of the quiz in 18.04-airspace-in-operations.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 2b25a386cf20
  question: Which airspace classes actually matter for flights below 400 ft?
  options:
    - All classes, since any one of them may extend down to the ground
    - Only Class G, since all others start above 400 ft
    - The 700 and 1,200 ft Class E vignettes, plus Class A
    - "Those reaching the surface: B, C, D and dashed-magenta E"
  correct: 3
- source: a5ff56bf2aa1
  question: What does the LAANC grid actually give you?
  options:
    - Automatic approval up to that square's ceiling; 0 ft means none
    - Automatic approval to 400 ft anywhere inside the controlled area
    - Advisory ceilings only; every flight still needs a manual waiver
    - Automatic approval at any altitude, but only during daylight
  correct: 0
- source: 029e43b0d2ae
  question: A roof inspection needs 3 cm GSD, which is 87.5 m. The LAANC square is 200 ft. Why can a granted authorisation still mean no?
  options:
    - LAANC grants expire after one hour, before the job is done
    - The job needs 87.5 m, but a 200 ft square allows only 61 m
    - The roof height raises the ceiling, so it allows 87.5 m anyway
    - The job needs 61 m, but a 200 ft square allows only 50 m

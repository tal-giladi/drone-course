  options:
    - A score of 6 exceeds the acceptance threshold, so all three must be refused
    - "2x3 and 3x2 match but need opposite fixes: prevention or survivability"
    - Ties show the scale is too coarse and should run from 1 to 10
    - The product double-counts severity and so overstates the risk

  question: Why do about half of planned flying days not fly?
  options:
    - Wind alone exceeds the limit on about half of all days
    - Clients cancel about half of their bookings at short notice for their own reasons
    - The single worst criterion, at 80%, sets the scrub rate
    - Eight go/no-go criteria multiply to a joint probability near 0.50

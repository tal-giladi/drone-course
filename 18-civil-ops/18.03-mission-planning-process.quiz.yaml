  question: What is the right response to a 50% scrub rate?
  options:
    - Cut the checklist down to only the three most likely failures
    - Settle crew, aircraft, airspace and access the day before
    - Relax the wind limit to raise the flyable fraction
    - Book twice as many days and accept the extra drives

- source: c0e23f17471d
  question: Why is course progress measured by time rather than by lesson count?
  options:
    - Lesson counts change every time the syllabus is rebuilt, so they cannot be stored
    - Time is the only field course.py records, since lessons have no stable identifiers
    - Counting lessons would include the optional tracks, while measuring time excludes them automatically
    - Lessons vary from 30 to 120 min, so counting them weights short and long lessons equally
  correct: 3
- source: 94114e3823cf
  question: What is the difference between a skip and a debt, and how does the tool keep them apart?
  options:
    - A debt is a lesson you started but did not finish; the tool marks it with a red status
    - A skip is permanent and a debt is temporary; the tool deletes debts after 30 days
    - A debt is a skip whose downstream lesson later fails; the stored reason and date point back to it
    - A skip needs instructor approval and a debt does not; the tool stores the approver name with the skip
  correct: 2
- source: c14aa781d44b
  question: After adding a lesson to the syllabus, in what order do you run the tools?
  options:
    - validate.py first to check the syllabus graph, then build.py to check the lesson files
    - build.py first to check the syllabus graph, then validate.py to check the lesson files
    - Only build.py, since it also validates headings, exercise ids and links in the files
    - course.py first to mark the lesson complete, then build.py to regenerate the sidebar
  correct: 1

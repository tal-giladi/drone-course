  question: A 984 Hz harmonic is sampled at 1 kHz. Where does it appear and why can't a notch remove it?
  options:
    - At 492 Hz; notches cannot reach above 400 Hz
    - At 984 Hz; notches cannot track that high
    - At 16 Hz by aliasing; it is indistinguishable from real motion

    - The horizontal position loop
  correct: 0
- source: 2a8af52110e9
  question: Why tune cascaded loops from the inside out?
  options:
    - Outer loops have higher bandwidth, so they must be tuned last
    - Tuning around a sloppy inner loop bakes in compensation
    - AUTOTUNE requires this order to run
    - Inner loop gains are reset whenever outer loop gains change
  correct: 1

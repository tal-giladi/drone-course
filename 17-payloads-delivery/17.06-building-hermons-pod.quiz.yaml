- source: 6f21d5973a72
  question: Four barriers guard against inadvertent release; with a common-cause beta of 0.30 all four give 9.8e-5. Which barriers actually protect you?
  options:
    - All four together, since each added barrier multiplies the residual further down
    - The arm gate and trim parameter, which the software checks every loop
    - The safety pin alone, since the geometry fails whenever power drops
    - The bistable geometry and safety pin, which are off the flight controller
  correct: 3

  question: The CEP's relative uncertainty is 1/sqrt(2n) and the mean's is sigma/sqrt(n). What do ten drops give you?
  options:
    - Both the mean and the CEP to within about 6%
    - The CEP to about 6%, but the mean only to about 22%
    - The mean to about 6 cm, but the CEP only to about 22%
    - Nothing useful at all; at least fifty drops are needed for either figure

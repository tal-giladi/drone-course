- source: "19e233781490"
  question: Why does everything the release does belong in one handler?
  options:
    - It is one event; three handlers are three chances to mistime it
    - One handler uses less CPU time in the flight controller's main-loop scheduler
    - ArduPilot lets only one Lua script command a servo output
    - Separate handlers would each log the event and triple the log
  correct: 0
- source: dfac39fbb039
  question: What does the knife-edge test catch, and why is it worth two minutes?
  options:
    - A latch that is unbalanced and may open under vibration
    - A wrong CoM offset, which is exactly what sets the pitch kick
    - A mass error that would make the throttle feedforward wrong
    - A pod that tumbles in the air instead of falling straight when it is released
  correct: 1

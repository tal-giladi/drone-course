# Multiple-choice version of the quiz in 17.06-building-hermons-pod.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: a0605d6e4d17
  question: The release mechanism is 69 g of an 81 g budget. The rangefinder and bracket add 15 g; endurance costs 1.46 s per gram. Does the budget close, and what do you do?
  options:
    - It misses by 3 g; drop the rangefinder, because a budget is a hard limit
    - It misses by 3 g; accept about 4 s for CEP 8.87 to 3.19 m and record it
    - It closes with 12 g spare, so the rangefinder fits with no trade at all
    - It misses by 3 g; shave the frame, since 3 g costs about 44 s of flight
  correct: 1
- source: a3320d941a9c
  question: Why is the delivery pod the easiest bill of materials in the course?
  options:
    - Every part comes in a single kit shipped as one VAT-exempt import
    - The pod reuses spares from earlier modules, so nothing is bought
    - Every part is under $75, so no import tax applies to any line
    - Almost nothing is a drone part; only the rangefinder is imported
  correct: 3

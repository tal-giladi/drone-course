# Multiple-choice version of the quiz in 17.03-spray-and-irrigation.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 4d3d4e70a34e
  question: At 50 L/ha Hermon's pump needs 1.48 L/min. The tank holds 0.5 L and the battery lasts 18.6 min; one tank covers 100 m2. What does this say about broadcast spraying a 6 ha field?
  options:
    - The tank lasts about 20 min, slightly outlasting a single battery
    - The tank empties in about 20 s, so one pass is about 600 tank loads
    - The tank lasts about 3 min, so one pass needs about six battery swaps
    - Tank and battery run out together, so each pass is one landing
  correct: 1
- source: 0658e2c099ae
  question: What is a 0.5 L spray tank on Hermon actually good for?
  options:
    - "Spot treatment: about 17 targets at 30 mL each inside one battery"
    - Broadcast coverage of about one hectare per battery at 50 L/ha
    - Fine-mist fogging, since small tank volumes suit very small droplets and low flow
    - Water ballast to trim the centre of mass for other payloads
  correct: 0

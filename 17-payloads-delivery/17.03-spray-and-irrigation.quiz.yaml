- source: a91c1ba4b772
  question: Drift distance is h*w/v_t. What is the cheapest drift control available?
  options:
    - "Fly faster: more ground speed shortens each drop's time aloft"
    - Use finer nozzles so the droplets reach the crop more quickly
    - "Fly lower: halving height from 3 m to 1.5 m halves the drift"
    - Add a drift-retardant adjuvant, which costs no coverage at all

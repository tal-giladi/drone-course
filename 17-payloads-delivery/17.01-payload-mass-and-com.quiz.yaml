# Multiple-choice version of the quiz in 17.01-payload-mass-and-com.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: ffd31d4ca7c9
  question: Why does 17 % more mass cost 21 % of the endurance?
  options:
    - Hover power scales as thrust^2, so power rises about 37 % for 17 % more mass
    - Battery sag rises with current, costing an extra 4 % on top of the mass penalty
    - Hover power scales as thrust^1.5, so power rises about 27 % for 17 % more mass
    - Hover power scales linearly with mass, plus about 4 % from the pod's drag
  correct: 2
- source: 06727301d40d
  question: Hover throttle rises from 26.5 % to 31.0 % with the payload. What does that show?
  options:
    - The motors are near saturation, so thrust-to-weight now limits the payload
    - The ESCs need recalibrating, since hover throttle should not change with mass
    - Endurance will fall by the same proportion as the rise in hover throttle
    - Lift is not the constraint; the pack limits the payload, not the propellers
  correct: 3

- source: 4e14b2d59108
  question: Why is inertia the payload penalty that scales worst?
  options:
    - It grows as m r, so 7.5x the distance gives just 7.5x the added pitch inertia
    - It grows as m^2, so doubling the payload quadruples the added inertia
    - It grows as r^3, so 7.5x the distance gives about 420x the added inertia
    - It grows as m r^2, so 7.5x the distance gives about 56x the added inertia
  correct: 3

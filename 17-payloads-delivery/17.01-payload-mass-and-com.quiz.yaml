  question: A payload raises pitch inertia 54 % and the PD attitude gains are unchanged. What happens?
  options:
    - Bandwidth and damping both fall about 19 %, and the lost damping shows up as oscillation in wind
    - Bandwidth falls about 19 % but damping rises, so the aircraft becomes sluggish yet noticeably more stable
    - Bandwidth and damping both fall 54 %, causing obvious oscillation already on the bench
    - Nothing measurable changes, since the rate loop automatically compensates for inertia
  correct: 0

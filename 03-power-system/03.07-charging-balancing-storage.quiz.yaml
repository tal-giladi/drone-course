  question: A lithium charge has a CC stage and a CV stage. What happens when people cut it short at the end of CC?
  options:
    - They get about 75 % charge; the last quarter goes in during CV
    - They get about 95 % charge; CV only tops up the last few percent
    - They get a full charge but unbalanced cells, since CV balances them
    - They overcharge the pack, since CV is what limits the voltage
  correct: 0
- source: 6d66d7bab49c
  question: What does a balance charger actually do?
  options:
    - Moves charge from high cells to low cells, equalising their capacity
    - Charges each cell separately to the same mAh, equalising their capacity
    - Bleeds charge from leading cells through shunts, equalising voltage
    - Raises the voltage of the weakest cells until they match the strongest
  correct: 2
- source: 37dcadb290a2
  question: Why does doubling the charge rate from 1C to 2C not halve the charge time?
  options:
    - The charger limits power, so 2C is automatically reduced back to 1C
    - Only CC scales with current; the diffusion-bound CV stage lengthens
    - Higher current heats the pack, and the charger pauses to let it cool
    - The CV stage scales with current too, but CC becomes much longer
  correct: 1

  question: What sets a LiPo cell's 3.7 V nominal voltage?
  options:
    - The number of electrode layers the manufacturer stacks inside the pouch
    - The cell's internal resistance, which drops the higher open-circuit voltage
    - The electrochemical potential of lithium in the cathode versus graphite
    - The balance charger's termination setting, which could be raised to 5 V

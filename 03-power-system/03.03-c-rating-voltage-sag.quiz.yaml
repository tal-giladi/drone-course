  question: What does BATT_FS_VOLTSRC = 1 do in ArduPilot?
  options:
    - Adds I x BATT_RESISTANCE back before comparing to failsafe thresholds
    - Switches the failsafe from pack voltage to consumed mAh as its trigger
    - Uses the lowest single-cell voltage instead of the total pack voltage
    - Delays the voltage failsafe by one second to ignore short transients
  correct: 0
